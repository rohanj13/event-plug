services:
  - type: web
    name: eventplug-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/EventPlug.Api/Dockerfile
    dockerContext: ./backend/EventPlug.Api
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: eventplug-db
          property: connectionString
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Swagger__Enabled
        value: "true"
      - key: Cors__AllowedOrigins__0
        value: https://*.lovable.app
      - key: Cors__AllowedOrigins__1
        value: https://*.lovableproject.com
      - key: Cors__AllowedOrigins__2
        value: http://localhost:5173

databases:
  - name: eventplug-db
    plan: free
    region: singapore
    databaseName: eventplug
    user: eventplug
    postgresMajorVersion: "16"
