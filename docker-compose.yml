services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventplug
      POSTGRES_DB: eventplug
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventplug -d eventplug"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/EventPlug.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eventplug;Username=eventplug
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
